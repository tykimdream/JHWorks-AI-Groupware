name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.24

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen --project apps/api

      - name: Verify local credential entry without real credentials
        run: python -m unittest discover -s tools -p 'test_store_openai_key.py'

      - name: Validate application
        run: pnpm validate

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.24
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:public-demo
      - name: Build same-origin standalone app
        run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          API_PROXY_TARGET: http://127.0.0.1:8100
      - name: Verify production CSP and expense workflow
        run: pnpm exec playwright test --config=playwright.production.config.ts
        env:
          E2E_PRODUCTION: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            playwright-public-demo-report/
            artifacts/feedback/*.png
            docs/portfolio/screenshots/

  container-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Start release topology
        run: docker compose up --build --detach

      - name: Run deployment smoke checks
        run: |
          mkdir -p artifacts/smoke
          python apps/api/app/ops/deployment_smoke.py \
            --output artifacts/smoke/latest.json

      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-smoke-report
          path: artifacts/smoke/latest.json
          if-no-files-found: warn

      - name: Stop release topology
        if: always()
        run: docker compose down --volumes


  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: jhworks_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: jhworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhworks_test -d jhworks_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      JHWORKS_TEST_POSTGRES_URL: postgresql+psycopg://jhworks_test:synthetic-ci-only@127.0.0.1:5432/jhworks_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.24
      - run: uv sync --frozen --project apps/api
      - name: Verify PostgreSQL approval queries and shared admission budgets
        working-directory: apps/api
        run: |
          test -n "$JHWORKS_TEST_POSTGRES_URL"
          uv run --frozen pytest \
            tests/test_postgres_approval_lists.py \
            tests/test_postgres_login_budget.py \
            tests/test_postgres_demo_workspace.py \
            tests/test_postgres_demo_isolation.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
