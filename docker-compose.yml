services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jhworks}
      POSTGRES_USER: ${POSTGRES_USER:-jhworks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jhworks-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jhworks} -d ${POSTGRES_DB:-jhworks}"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - jhworks-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      JHWORKS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jhworks}:${POSTGRES_PASSWORD:-jhworks-local}@db:5432/${POSTGRES_DB:-jhworks}
      JHWORKS_JWT_SECRET: ${JHWORKS_JWT_SECRET:-local-compose-secret-change-me}
      JHWORKS_ENVIRONMENT: ${JHWORKS_ENVIRONMENT:-development}
      JHWORKS_LOG_FORMAT: ${JHWORKS_LOG_FORMAT:-json}
      JHWORKS_LOG_LEVEL: ${JHWORKS_LOG_LEVEL:-INFO}
      JHWORKS_FRONTEND_ORIGIN: http://localhost:3000
      JHWORKS_COOKIE_SECURE: "false"
      JHWORKS_OPENAI_API_KEY: ${JHWORKS_OPENAI_API_KEY:-}
      JHWORKS_OPENAI_MODEL: ${JHWORKS_OPENAI_MODEL:-gpt-5.4-mini}
      JHWORKS_AI_REVIEW_TIMEOUT_SECONDS: ${JHWORKS_AI_REVIEW_TIMEOUT_SECONDS:-20}
      JHWORKS_APPROVAL_DRAFT_CONFIRMATION_TTL_MINUTES: ${JHWORKS_APPROVAL_DRAFT_CONFIRMATION_TTL_MINUTES:-15}
      JHWORKS_LEAVE_DRAFT_CONFIRMATION_TTL_MINUTES: ${JHWORKS_LEAVE_DRAFT_CONFIRMATION_TTL_MINUTES:-15}
      JHWORKS_LEAVE_SUBMIT_CONFIRMATION_TTL_MINUTES: ${JHWORKS_LEAVE_SUBMIT_CONFIRMATION_TTL_MINUTES:-10}
      JHWORKS_POLICY_EMBEDDING_MODEL: ${JHWORKS_POLICY_EMBEDDING_MODEL:-text-embedding-3-small}
      JHWORKS_POLICY_EMBEDDING_DIMENSIONS: ${JHWORKS_POLICY_EMBEDDING_DIMENSIONS:-1536}
      JHWORKS_POLICY_RETRIEVAL_TOP_K: ${JHWORKS_POLICY_RETRIEVAL_TOP_K:-4}
      JHWORKS_POLICY_RETRIEVAL_MIN_SCORE: ${JHWORKS_POLICY_RETRIEVAL_MIN_SCORE:-0.15}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  jhworks-postgres:
