name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.24

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen --project apps/api

      - name: Validate application
        run: pnpm validate

  container-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Start release topology
        run: docker compose up --build --detach

      - name: Run deployment smoke checks
        run: |
          mkdir -p artifacts/smoke
          python apps/api/app/ops/deployment_smoke.py \
            --output artifacts/smoke/latest.json

      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-smoke-report
          path: artifacts/smoke/latest.json
          if-no-files-found: warn

      - name: Stop release topology
        if: always()
        run: docker compose down --volumes

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
