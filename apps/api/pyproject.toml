[project]
name = "jhworks-api"
version = "0.1.0"
description = "JHWorks AI Groupware modular monolith API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16.5",
  "email-validator>=2.2.0",
  "fastapi>=0.116.1",
  "openai>=3.3.1",
  "psycopg[binary]>=3.2.10",
  "pydantic-settings>=2.10.1",
  "pyjwt>=2.10.1",
  "pwdlib[argon2]>=0.2.1",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0",
  "pgvector>=0.4.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
