name: JHW Pattern Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pattern-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PATTERN_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Require successful CI on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" \
            --jq '.workflow_runs | any(.head_branch == "main")' | grep -qx true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pattern
      - run: pnpm type-check:storybook
      - run: pnpm build:storybook
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/pattern-storybook/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
